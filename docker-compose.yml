version: '3.8'

services:
  frontend:
    build:
      context: ./et-ai-concierge
      target: runner
      args:
        - NEXT_PUBLIC_API_URL=/api
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - et-network

  backend:
    build:
      context: ./backend
      target: runner
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/et-ai-concierge
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
      - PORT=8000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - et-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - et-network

volumes:
  mongodb_data:

networks:
  et-network:
    driver: bridge
