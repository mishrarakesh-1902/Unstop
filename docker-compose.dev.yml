version: '3.8'

services:
  frontend:
    build:
      context: ./et-ai-concierge
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./et-ai-concierge:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    environment:
      - MONGO_URI=mongodb://mongodb:27017/et-ai-concierge
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
      - PORT=8000
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
